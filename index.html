<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>VoxelCraft — воксельная песочница</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- Подводный эффект -->
  <div id="underwater"></div>

  <!-- ===================== HUD ===================== -->
  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="hurt-flash"></div>
    <div id="status-row">
      <div id="hearts"></div>
      <div id="apples" class="hidden"></div>
    </div>
    <div id="break-bar" class="hidden"><div id="break-fill"></div></div>
    <div id="debug" class="hidden"></div>
    <div id="hotbar"></div>
    <button id="btn-pause-hud" class="icon-btn hidden" aria-label="Pause">⏸</button>
  </div>

  <!-- ===================== Сенсорное управление ===================== -->
  <div id="touch-controls" class="hidden">
    <div id="look-zone"></div>
    <div id="joystick"><div id="joy-knob"></div></div>
    <div id="touch-buttons">
      <button id="btn-inventory" class="touch-btn" aria-label="Inventory">🎒</button>
      <button id="btn-fly" class="touch-btn" aria-label="Fly">🕊</button>
      <button id="btn-break" class="touch-btn" aria-label="Break">⛏</button>
      <button id="btn-place" class="touch-btn" aria-label="Place">🧱</button>
      <button id="btn-sneak" class="touch-btn small" aria-label="Down">▼</button>
      <button id="btn-jump" class="touch-btn small" aria-label="Jump">▲</button>
    </div>
  </div>

  <!-- ===================== Экраны ===================== -->
  <div id="loading-screen" class="screen">
    <div class="panel">
      <h1 class="logo">Voxel<span>Craft</span></h1>
      <div class="tagline" data-i18n="tagline">Воксельная песочница</div>
      <div class="progress"><div id="loading-bar"></div></div>
      <div id="loading-text" data-i18n="loading">Генерация мира…</div>
    </div>
  </div>

  <div id="menu-screen" class="screen hidden">
    <div class="panel">
      <h1 class="logo">Voxel<span>Craft</span></h1>
      <div class="tagline" data-i18n="tagline">Воксельная песочница</div>
      <div class="menu-buttons">
        <button id="btn-play" class="btn primary" data-i18n="play">Играть</button>
        <button id="btn-new-world" class="btn hidden" data-i18n="new_world">Новый мир</button>
        <button id="btn-reward" class="btn reward" data-i18n="reward_btn">Смотреть рекламу</button>
        <button id="btn-settings" class="btn" data-i18n="settings">Настройки</button>
        <button id="btn-howto" class="btn" data-i18n="howto">Как играть</button>
      </div>
    </div>
  </div>

  <div id="mode-screen" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="mode_title">Выберите режим</h2>
      <div class="menu-buttons">
        <button id="btn-mode-survival" class="btn primary">
          <span data-i18n="mode_survival">Выживание</span>
          <small data-i18n="mode_survival_desc">Собирайте ресурсы, крафтите инструменты. Мобы опасны, полёта нет.</small>
        </button>
        <button id="btn-mode-creative" class="btn">
          <span data-i18n="mode_creative">Креатив</span>
          <small data-i18n="mode_creative_desc">Бесконечные блоки, мгновенное ломание, полёт. Стройте что угодно!</small>
        </button>
        <button id="btn-mode-back" class="btn" data-i18n="back">Назад</button>
      </div>
    </div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="pause">Пауза</h2>
      <div class="menu-buttons">
        <button id="btn-resume" class="btn primary" data-i18n="resume">Продолжить игру</button>
        <button id="btn-home" class="btn" data-i18n="to_spawn">К спавну</button>
        <button id="btn-reward2" class="btn reward" data-i18n="reward_btn">Смотреть рекламу</button>
        <button id="btn-settings2" class="btn" data-i18n="settings">Настройки</button>
        <button id="btn-save-quit" class="btn" data-i18n="save_quit">Сохранить и выйти</button>
      </div>
    </div>
  </div>

  <div id="howto-screen" class="screen hidden">
    <div class="panel wide">
      <h2 data-i18n="howto_title">Как играть</h2>
      <div class="howto-text" data-i18n-html="howto_text"></div>
      <div class="menu-buttons">
        <button id="btn-howto-back" class="btn primary" data-i18n="back">Назад</button>
      </div>
    </div>
  </div>

  <div id="settings-screen" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="settings">Настройки</h2>
      <div class="settings-row">
        <label data-i18n="sound">Звук</label>
        <input type="checkbox" id="set-sound" checked />
      </div>
      <div class="settings-row">
        <label><span id="set-volume-title">Громкость</span>: <span id="set-volume-label">80%</span></label>
        <input type="range" id="set-volume" min="0" max="100" value="80" />
      </div>
      <div class="settings-row">
        <label data-i18n="view_distance">Дальность прорисовки</label>
        <span id="set-viewdist-label">5</span>
        <input type="range" id="set-viewdist" min="3" max="8" value="5" />
      </div>
      <div class="settings-row">
        <label data-i18n="language">Язык</label>
        <select id="set-lang">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="menu-buttons">
        <button id="btn-settings-back" class="btn primary" data-i18n="back">Назад</button>
      </div>
    </div>
  </div>

  <!-- ===================== Инвентарь (E / 🎒) ===================== -->
  <div id="inventory-screen" class="screen hidden">
    <div class="panel inv-panel">
      <div class="inv-head">
        <h2 data-i18n="inv_title">Инвентарь</h2>
        <span class="inv-hint" data-i18n="inv_hint">ЛКМ — взять/положить · ПКМ — по одному</span>
      </div>
      <div class="inv-wrap">
        <div id="inv-left">
          <div class="inv-title" id="inv-left-title"></div>
          <div id="inv-list" class="inv-list catalog"></div>
        </div>
        <div id="inv-grid" class="inv-grid"></div>
      </div>
      <div class="menu-buttons inv-actions">
        <button id="btn-inv-close" class="btn primary" data-i18n="close">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- Предмет «в руке» следует за курсором -->
  <div id="item-cursor" class="hidden"></div>

  <!-- Тосты -->
  <div id="toast"></div>

  <!-- Реклама / загрузка -->
  <div id="ad-overlay" class="hidden"><div class="spinner"></div></div>

  <!-- Вспышка молнии -->
  <div id="lightning"></div>

  <!-- Подсказка поворота экрана -->
  <div id="rotate-hint" class="hidden">
    <div class="rotate-icon">📱</div>
    <div data-i18n="rotate_device">Поверните телефон горизонтально</div>
  </div>

  <!-- Описание награды -->
  <div id="reward-desc" class="hidden" data-i18n="reward_desc"></div>

  <script src="game.js"></script>
</body>
</html>
